spring.application.name=ruta-vital-backend
server.port=${PORT:8080}

# MongoDB (en Render se define MONGODB_URI con la cadena de MongoDB Atlas) - RNF-09
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rutavital}
spring.data.mongodb.auto-index-creation=true

# JWT: en produccion JWT_SECRET debe ser un valor largo y secreto
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-ruta-vital-cambiar-en-produccion}
app.jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

# CORS: URL del frontend (Vercel). Varias URL separadas por coma.
app.cors.origenes=${FRONTEND_URL:http://localhost:5173}

spring.jackson.time-zone=America/Bogota
